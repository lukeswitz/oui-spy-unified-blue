name: Build Firmware & Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version-check:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Versions match tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            v*) V="${TAG#v}" ;;
            *) echo "not a version tag ($TAG) — skipping"; exit 0 ;;
          esac
          MAJOR="${V%%.*}"; REST="${V#*.}"; MINOR="${REST%%.*}"; PATCH="${REST#*.}"
          WANT_NUM=$(printf '0x%02d%02d%02d' "$MAJOR" "$MINOR" "$PATCH")

          FW=$(sed -n 's/.*#define FW_VERSION  *"\([0-9.]*\)".*/\1/p' src/protocol.h)
          FWNUM=$(sed -n 's/.*#define FW_VERSION_NUM  *\(0x[0-9a-fA-F]*\).*/\1/p' src/protocol.h)
          PUB=$(sed -n 's/^version: *\([0-9.]*\)+.*/\1/p' companion/pubspec.yaml)
          APP=$(sed -n "s/.*appVersion = '\([0-9.]*\)'.*/\1/p" companion/lib/features/config/device_config.dart)
          WEB=$(sed -n 's/.*<div class="version">v\([0-9.]*\)<\/div>.*/\1/p' docs/index.html)

          rc=0
          check() { [ "$2" = "$3" ] || { echo "::error::$1 is '$2', tag wants '$3'"; rc=1; }; }
          check "src/protocol.h FW_VERSION"          "$FW"    "$V"
          check "src/protocol.h FW_VERSION_NUM"      "$FWNUM" "$WANT_NUM"
          check "companion/pubspec.yaml"             "$PUB"   "$V"
          check "device_config.dart appVersion"      "$APP"   "$V"
          check "docs/index.html flasher version"    "$WEB"   "$V"
          [ $rc -eq 0 ] && echo "all version sources = $V"
          exit $rc

  build-firmware:
    name: Firmware (${{ matrix.role }}-${{ matrix.board }})
    needs: [version-check]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: v3_app_controlled
            role: node
            board: xiao_s3
            chip: esp32s3
          - env: v3_app_controlled_s3_devkitc
            role: node
            board: s3_devkitc
            chip: esp32s3
          - env: v3_app_controlled_tdongle_s3
            role: node
            board: tdongle_s3
            chip: esp32s3
          - env: v3_app_controlled_c5
            role: node
            board: xiao_c5
            chip: esp32c5
          - env: v3_node_manager_wroom
            role: mgr
            board: wroom
            chip: esp32
          - env: v3_node_manager_xiao_c3
            role: mgr
            board: xiao_c3
            chip: esp32c3
          - env: v3_node_manager_s3
            role: mgr
            board: xiao_s3
            chip: esp32s3
          - env: v3_node_manager_s3_devkitc
            role: mgr
            board: s3_devkitc
            chip: esp32s3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware (${{ matrix.env }})
        run: pio run -e ${{ matrix.env }}

      - name: Package firmware
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          ROLE="${{ matrix.role }}"
          BOARD="${{ matrix.board }}"
          ENV="${{ matrix.env }}"
          STEM="oui-spy-${ROLE}-${BOARD}-${VERSION}"
          mkdir -p dist
          cp ".pio/build/${ENV}/firmware.bin"   "dist/${STEM}.bin"
          cp ".pio/build/${ENV}/bootloader.bin" "dist/${STEM}-bootloader.bin"
          cp ".pio/build/${ENV}/partitions.bin" "dist/${STEM}-partitions.bin"
          BOOT_APP0=$(find ~/.platformio -name "boot_app0.bin" -path "*/partitions/*" | head -1)
          cp "$BOOT_APP0" "dist/${STEM}-boot_app0.bin"
          (cd dist && tar czf "../${STEM}-usb.tar.gz" \
            "${STEM}-bootloader.bin" "${STEM}-partitions.bin" "${STEM}.bin" "${STEM}-boot_app0.bin")

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firmware-${{ matrix.role }}-${{ matrix.board }}
          path: |
            dist/oui-spy-*.bin
            oui-spy-*-usb.tar.gz

  publish-flasher:
    name: Refresh web flasher bins
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-firmware]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: companion

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts
          pattern: firmware-*
          merge-multiple: true

      - name: Copy release bins into docs/firmware
        run: |
          VERSION="${GITHUB_REF_NAME}"
          : > "${RUNNER_TEMP}/targets.txt"
          for pair in node:xiao_s3 node:s3_devkitc node:xiao_c5 \
                      mgr:xiao_s3 mgr:s3_devkitc mgr:xiao_c3 mgr:wroom; do
            ROLE="${pair%%:*}"; BOARD="${pair##*:}"
            STEM="oui-spy-${ROLE}-${BOARD}-${VERSION}"
            DEST="docs/firmware/${ROLE}-${BOARD}"
            mkdir -p "$DEST"
            for part in "":firmware "-bootloader":bootloader "-partitions":partitions "-boot_app0":boot_app0; do
              SUF="${part%%:*}"; OUT="${part##*:}"
              SRC=$(find artifacts -type f -name "${STEM}${SUF}.bin" | head -1)
              if [ -z "$SRC" ]; then
                echo "::error::missing ${STEM}${SUF}.bin"
                exit 1
              fi
              cp "$SRC" "${DEST}/${OUT}.bin"
            done
            echo "${ROLE}-${BOARD}" >> "${RUNNER_TEMP}/targets.txt"
          done

      - name: Commit bins, record version pin, push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/firmware
          if git diff --cached --quiet; then
            echo "flasher bins already current"
          else
            git commit -m "chore: web flasher bins ${GITHUB_REF_NAME}"
          fi

          TAG="${GITHUB_REF_NAME}" SHA="$(git rev-parse HEAD)" \
          TARGETS="$(tr '\n' ' ' < "${RUNNER_TEMP}/targets.txt")" python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path('docs/firmware/versions.json')
          entries = json.loads(p.read_text()) if p.exists() else []
          version = os.environ['TAG'].lstrip('v')
          entries = [e for e in entries if e.get('version') != version]
          entries.insert(0, {
              'version': version,
              'ref': os.environ['SHA'],
              'targets': os.environ['TARGETS'].split(),
          })
          p.write_text(json.dumps(entries, indent=2) + '\n')
          PY

          git add docs/firmware/versions.json
          if git diff --cached --quiet; then
            echo "flasher version manifest already current"
          else
            git commit -m "chore: flasher version manifest ${GITHUB_REF_NAME}"
          fi
          git push origin HEAD:companion

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-firmware]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts
          pattern: firmware-*
          merge-multiple: true

      - name: Create Draft Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631
        with:
          draft: true
          generate_release_notes: false
          body: |
            ## OUI-SPY ${{ github.ref_name }}

            > [!NOTE]
            > Early beta — file bugs in Issues.

            ### What's new since v0.5.0

            **Added**
            - Flock confidence (VERIFIED / HIGH / SUSPECTED) on feed and config detection rows, in the detection detail sheet, and as V/H/S chips in the wardrive flock panel, with a confidence filter group in the detections filter sheet
            - DeFlock cross-reference: mapped ALPRs from OpenStreetMap on the wardrive map, and every flock detection with a fix is scored against them — `ON MAP` within 75 m of a mapped camera, `UNMAPPED` beyond 250 m, `NO MAP DATA` where nothing has been fetched. Tiles are cached on the phone, so a driven area keeps resolving offline
            - Contributing an unmapped find to OpenStreetMap is offered only for a fully validated flock detection (name + XUNTONG 0x09C8 + TN serial); the link is copied for you to review and submit by hand, never posted by the app
            - WDGWars territory layer on the wardrive map (gang hulls, viewport-culled, 5 min cache, off by default)
            - WDGWars account stats: today / 7d / reinforced / credits / cracked, gang role, country / joined / bounties
            - CONFIG nav tap toggles the section sheet open and closed

            **Fixed — app**
            - Wardrive sessions finalize on stop, on detach and on app shutdown; reconnect offers to continue or stop the open session
            - Foxhunt blocked for law-enforcement targets (Axon 00:25:DF): the action icon is hidden on feed rows and a reason is shown if it is reached another way
            - CSV import and rescan no longer promote a row to flock on an OUI match alone; wardrive rows promote to detector only
            - App-side flock OUI table synced: 00:40:8C and AC:CC:8E added, Falcon false positives 94:2A:6F and F4:E2:C6 removed
            - Tapping a detection isolates that pin instead of drawing the whole session; a finished session frames the whole track; config tab index survives rebuilds
            - WDGWars upload moved to v2 gzip + job poll (10.2 MB CSV → 750 KB on the wire), buffered multipart body, QUEUED state while the job runs, stale error banner cleared
            - WDGWars upload finishes with the server's own counts — `N imported · N new · N merged` — instead of a generic success, or the server's rejection reason on failure
            - Feed search queries the database, not just the 500-row live buffer
            - WiGLE and WDGWars send timeout scales with file size (60 s + 12 s/MB, capped at 900 s) and retries on a fresh connection
            - CommandSheet close button (sheets were near-undismissable on mobile)

            **Fixed — firmware**
            - Detector signatures now run under wardrive: BLE checked pre-dedup, WiFi fed from the wardrive ISR
            - `SIG_AXON` WiFi early-return no longer starves watchlist matching; a `sigDedup` hit no longer skips the remaining signature checks
            - Axon matches BT SIG CID 0x034D and service UUID 0xFC81, not OUI alone
            - Ray-Ban Meta criteria synced to upstream (CID 0x0D53, service 0xFD5F, names)
            - Flock WiFi uses the upstream method only (addr3/BSSID match dropped), RSSI floor −95, wildcard probes no longer mislabeled `oui_addr2`
            - Flock BLE emits on name or Raven service UUID alone, otherwise only on the full validated signal set
            - Flock OUI list: Ubiquiti false positives dropped; f8:a2:d6, 00:40:8c and ac:cc:8e demoted to the extended list
            - `detectorHostSuspend` resume left `wifiActive` false on S3

            **Build**
            - Built with Flutter 3.47.0 / Dart 3.13; analyzer clean, 53 tests pass

            ### Firmware

            Companion app picks the matching `.bin` automatically by board + role over BLE DFU.

            | Target | Role | OTA asset | First flash (USB) |
            |--------|------|-----------|-------------------|
            | XIAO ESP32-S3 | node | `oui-spy-node-xiao_s3-${{ github.ref_name }}.bin` | `oui-spy-node-xiao_s3-${{ github.ref_name }}-usb.tar.gz` |
            | ESP32-S3 N16R8 DevKitC | node | `oui-spy-node-s3_devkitc-${{ github.ref_name }}.bin` | `oui-spy-node-s3_devkitc-${{ github.ref_name }}-usb.tar.gz` |
            | LilyGO T-Dongle-S3 (LCD + SD) | node | `oui-spy-node-tdongle_s3-${{ github.ref_name }}.bin` | `oui-spy-node-tdongle_s3-${{ github.ref_name }}-usb.tar.gz` |
            | XIAO ESP32-C5 (dual-band 2.4+5GHz) | node | `oui-spy-node-xiao_c5-${{ github.ref_name }}.bin` | `oui-spy-node-xiao_c5-${{ github.ref_name }}-usb.tar.gz` |
            | ESP32 WROOM   | mgr  | `oui-spy-mgr-wroom-${{ github.ref_name }}.bin`   | `oui-spy-mgr-wroom-${{ github.ref_name }}-usb.tar.gz` |
            | XIAO ESP32-S3 (recommended) | mgr  | `oui-spy-mgr-xiao_s3-${{ github.ref_name }}.bin` | `oui-spy-mgr-xiao_s3-${{ github.ref_name }}-usb.tar.gz` |
            | ESP32-S3 N16R8 DevKitC | mgr  | `oui-spy-mgr-s3_devkitc-${{ github.ref_name }}.bin` | `oui-spy-mgr-s3_devkitc-${{ github.ref_name }}-usb.tar.gz` |
            | XIAO ESP32-C3 | mgr  | `oui-spy-mgr-xiao_c3-${{ github.ref_name }}.bin` | `oui-spy-mgr-xiao_c3-${{ github.ref_name }}-usb.tar.gz` |

            First-time flash on bare board: extract `*-usb.tar.gz` and use webflasher or esptool.

            - Web flasher: https://lukeswitz.github.io/oui-spy-unified-blue/

            ### Companion App

            | Platform | File | Instructions |
            |----------|------|--------------|
            | **Android** | `oui-spy-${{ github.ref_name }}.apk` | Download signed APK, tap to install. |
            | **macOS** | `oui-spy-macos-${{ github.ref_name }}.zip` | Extract, move `.app` to Applications, run. Signed with Developer ID. |
            | **iOS** | [TestFlight](https://testflight.apple.com/join/5RCKgnJ2) | Join beta via TestFlight. |

            ### Requirements
            - Boards: XIAO ESP32-S3 or ESP32-S3 N16R8 DevKitC (node); XIAO ESP32-S3 (recommended), ESP32-S3 N16R8 DevKitC, XIAO ESP32-C3, or ESP32 WROOM (manager)
            - BLE-capable phone/computer
            - GPS/Location for wardriving
            - The DeFlock layer is off by default. Turning it on sends the map viewport bounding box to a public Overpass mirror (overpass-api.de, falling back to overpass.private.coffee), which discloses the area you are looking at. Detections never leave the phone.

            **Full Changelog**: https://github.com/lukeswitz/oui-spy-unified-blue/compare/v0.5.0...${{ github.ref_name }}
          files: |
            artifacts/**/*.bin
            artifacts/**/*.tar.gz
