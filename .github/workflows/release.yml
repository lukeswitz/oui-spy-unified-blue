name: Build Firmware & Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-firmware:
    name: Firmware (ESP32-S3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ hashFiles('platformio.ini') }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run

      - name: Package firmware
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          mkdir -p dist
          cp .pio/build/seeed_xiao_esp32s3/bootloader.bin dist/
          cp .pio/build/seeed_xiao_esp32s3/partitions.bin dist/
          cp .pio/build/seeed_xiao_esp32s3/firmware.bin "dist/oui-spy-unified-blue.bin"
          # boot_app0.bin from framework
          find ~/.platformio -name "boot_app0.bin" -path "*/partitions/*" | head -1 | xargs -I{} cp {} dist/
          cd dist && tar czf "../oui-spy-firmware-${VERSION}.tar.gz" *.bin

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: firmware
          path: oui-spy-firmware-*.tar.gz

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-firmware]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: artifacts

      - name: Create Draft Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631  # v2.2.2
        with:
          draft: true
          generate_release_notes: true
          body: |
            ## OUI-SPY ${{ github.ref_name }}

            ### Firmware

            Download `oui-spy-firmware-${{ github.ref_name }}.tar.gz`, extract, and flash:

            ```bash
            tar xzf oui-spy-firmware-${{ github.ref_name }}.tar.gz
            cp *.bin firmware/
            python3 flash.py
            ```

            ### Companion App

            | Platform | File | Instructions |
            |----------|------|-------------|
            | **Android** | `oui-spy-${{ github.ref_name }}.apk` | Download APK, tap to install. Enable "Install unknown apps" in Settings if prompted. |
            | **macOS** | `oui-spy-macos-${{ github.ref_name }}.zip` | Extract zip, move `.app` to Applications, run. Signed with Developer ID. |
            | **iOS** | [TestFlight](https://testflight.apple.com/join/XXXX) | Join beta via TestFlight link. |

            ### Requirements
            - Seeed Studio XIAO ESP32-S3
            - Bluetooth LE capable phone/computer
            - GPS/Location services for wardriving
          files: |
            artifacts/firmware/*
