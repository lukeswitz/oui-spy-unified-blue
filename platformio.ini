; =============================================================================
; OUI-SPY Unified Firmware - XIAO ESP32-S3
; =============================================================================

[env:seeed_xiao_esp32s3]
platform = espressif32@^6.3.0
board = seeed_xiao_esp32s3
framework = arduino

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCONFIG_BT_NIMBLE_ENABLED=1
    -Isrc/raw

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.0
    mathieucarbou/ESP Async WebServer@^3.0.6
    adafruit/Adafruit NeoPixel@^1.12.0
    bblanchon/ArduinoJson@^7.0.4
    mikalhart/TinyGPSPlus@^1.1.0

; Flash: 8MB QIO, bootloader at 0x0, partitions at 0x8000, app at 0x10000
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 8MB

build_src_filter = +<*> -<raw/> -<main_unified.cpp> -<ble_gatt.cpp> -<mesh_espnow.cpp> -<engine_registry.cpp> -<engines/>

; =============================================================================
; OUI-SPY v3.0 — App-Controlled (BLE GATT only, no boot selector)
; =============================================================================
[env:v3_app_controlled]
platform = espressif32@^6.3.0
board = seeed_xiao_esp32s3
framework = arduino

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCONFIG_BT_NIMBLE_ENABLED=1
    -DCONFIG_BT_NIMBLE_LOG_LEVEL=0
    ; Pin NimBLE host to core 1 (WiFi runs on core 0 by default).
    ; Improves coex throughput when WiFi promiscuous + BLE scan concurrent.
    -DCONFIG_BT_NIMBLE_PINNED_TO_CORE=1
    -DCONFIG_BT_NIMBLE_TASK_STACK_SIZE=4096

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.0

; Build v3 files + engines + ODID lib, exclude old mode files and raw/
build_src_filter =
    +<protocol.h>
    +<engine_registry.cpp>
    +<engine_registry.h>
    +<ble_gatt.cpp>
    +<ble_gatt.h>
    +<mesh_espnow.cpp>
    +<mesh_espnow.h>
    +<main_unified.cpp>
    +<engines/*.cpp>
    +<engines/*.h>
    +<opendroneid.c>
    +<opendroneid.h>
    +<odid_wifi.h>
    +<wifi.c>
    -<main.cpp>
    -<mode_*.cpp>
    -<raw/>

board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 8MB
