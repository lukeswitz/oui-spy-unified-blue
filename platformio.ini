; =============================================================================
; TEST-ONLY: real BLE central that drives a node DUT through the phone GATT
; sequence (offline-scan ON + detector) and cycles disconnect/reconnect, to
; reproduce/verify the offline-scan reconnect bug on real hardware. Flash to a
; second S3; read the NODE's serial for engine/scan state. Not shipped.
; =============================================================================
[env:v3_test_central]
extends = env:v3_app_controlled
build_flags =
    ${env:v3_app_controlled.build_flags}
    -DOUISPY_TEST_CENTRAL=1
build_src_filter =
    +<test_central_driver.cpp>

[env:v3_app_controlled_statuslog]
extends = env:v3_app_controlled
build_flags =
    ${env:v3_app_controlled.build_flags}
    -DOUISPY_STATUS_LOG=1

[env:v3_node_manager_s3_dettest]
extends = env:v3_node_manager_s3
build_flags =
    ${env:v3_node_manager_s3.build_flags}
    -DOUISPY_MGR_DET_TEST=1

[env:v3_node_manager_s3_wdcycle]
extends = env:v3_node_manager_s3
build_flags =
    ${env:v3_node_manager_s3.build_flags}
    -DOUISPY_WD_CYCLE_TEST=1

[env:v3_node_manager_s3_engstress]
extends = env:v3_node_manager_s3
build_flags =
    ${env:v3_node_manager_s3.build_flags}
    -DOUISPY_ENGSTRESS=1
    -DOUISPY_NO_RECONCILE=1

[env:v3_node_manager_s3_e2e]
extends = env:v3_node_manager_s3
build_flags =
    ${env:v3_node_manager_s3.build_flags}
    -DOUISPY_E2E_SMOKETEST=1

[env:v3_app_controlled_c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c5
framework = arduino
extra_scripts = pre:c5_toolchain_path.py
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
    -DOUISPY_DUAL_BAND
    -DOUISPY_NIMBLE2
    -DOUISPY_BOARD=\"xiao_c5\"
    -DOUISPY_XIAO_C5=1
    -DOUISPY_NO_MESH=1
    -DOUISPY_LED_ACTIVE_HIGH
    -DPIN_BUZZER=25
    -DPIN_LED=27
    -DPIN_GPS_RX=12
    -DPIN_GPS_TX=11
build_src_flags =
    -include src/ble_nimble_compat.h
upload_speed = 115200
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
    mikalhart/TinyGPSPlus@^1.1.0
build_src_filter = ${env:v3_app_controlled.build_src_filter}
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.flash_mode = dio
board_upload.flash_size = 8MB
custom_sdkconfig =
    CONFIG_ESP_COEX_SW_COEXIST_ENABLE=y
    CONFIG_BT_NIMBLE_ENABLED=y
    CONFIG_BT_NIMBLE_LOG_LEVEL_NONE=y
    CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    CONFIG_BT_NIMBLE_MSYS_1_BLOCK_COUNT=12
    CONFIG_BT_NIMBLE_MSYS_2_BLOCK_COUNT=8
    CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM=4
    CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM=8
    CONFIG_ESP_WIFI_STATIC_TX_BUFFER=y
    CONFIG_ESP_WIFI_STATIC_TX_BUFFER_NUM=2
    CONFIG_ESP_WIFI_AMPDU_TX_ENABLED=n
    CONFIG_ESP_WIFI_AMPDU_RX_ENABLED=n
    CONFIG_ESP_WIFI_RX_MGMT_BUF_NUM_DEF=2
    CONFIG_ESP_WIFI_MGMT_SBUF_NUM=6
    CONFIG_ESP_WIFI_CSI_ENABLED=n
    CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=n
    CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=32768
custom_component_remove =
    espressif/esp-modbus

[env:v3_app_controlled_c5_wdbench]
extends = env:v3_app_controlled_c5
build_flags =
    ${env:v3_app_controlled_c5.build_flags}
    -DOUISPY_SWEEPLOG=1
    -DOUISPY_WDBENCH=1
    -DOUISPY_WDBENCH_CHEND=11
    -DOUISPY_WDBENCH_LABEL=\"both-ch1-11\"

[env:v3_app_controlled_c5_wdbench_pri]
extends = env:v3_app_controlled_c5
build_flags =
    ${env:v3_app_controlled_c5.build_flags}
    -DOUISPY_SWEEPLOG=1
    -DOUISPY_WDBENCH=1
    -DOUISPY_WDBENCH_CHEND=11
    -DOUISPY_WDBENCH_NODFS=1
    -DOUISPY_WDBENCH_LABEL=\"both-nodfs\"

[env:v3_app_controlled_c5_wdbench_both_radios]
extends = env:v3_app_controlled_c5
build_flags =
