; =============================================================================
; OUI-SPY MANAGER on ESP32-WROOM — BLE GATT + mesh RX aggregator, NO engines
; =============================================================================
[env:v3_node_manager_wroom]
platform = espressif32@^6.3.0
board = esp32dev
framework = arduino

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_BT_NIMBLE_ENABLED=1
    -DCONFIG_BT_NIMBLE_LOG_LEVEL=0
    -DCONFIG_BT_NIMBLE_PINNED_TO_CORE=0
    -DCONFIG_BT_NIMBLE_TASK_STACK_SIZE=8192
    -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192
    -DCONFIG_ESP_COEX_SW_COEXIST_ENABLE=1
    -DOUISPY_ROLE_MANAGER=1

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.0

build_src_filter =
    +<protocol.h>
    +<engine_registry.cpp>
    +<engine_registry.h>
    +<ble_gatt.cpp>
    +<ble_gatt.h>
    +<ota_handler.cpp>
    +<ota_handler.h>
    +<wifi_ota_handler.cpp>
    +<wifi_ota_handler.h>
    +<mesh_espnow.cpp>
    +<mesh_espnow.h>
    +<manager/manager_main.cpp>
    +<engines/*.cpp>
    +<engines/*.h>
    +<opendroneid.c>
    +<opendroneid.h>
    +<odid_wifi.h>
    +<wifi.c>
    -<main.cpp>
    -<main_unified.cpp>
    -<mode_*.cpp>
    -<raw/>

board_build.partitions = huge_app.csv

[env:smoke_s3]
extends = env:v3_app_controlled
build_flags = ${env:v3_app_controlled.build_flags}
    -DOUISPY_SMOKE_TEST=1
