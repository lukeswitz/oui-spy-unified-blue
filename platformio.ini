; =============================================================================
; OUI-SPY NODE on LilyGO T-Dongle-C5 — ST7735S 80x160 LCD + SPI TF slot
; 16MB flash, 8MB PSRAM. LCD and SD share one SPI bus (SCK 6 / MOSI 2 / MISO 7).
; Build with:  OUISPY_C5_ENV=v3_app_controlled_tdongle_c5 ./build_c5.sh
; =============================================================================
[env:v3_app_controlled_tdongle_c5]
extends = env:v3_app_controlled_c5
board = tdongle-c5

build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
    -DOUISPY_DUAL_BAND
    -DOUISPY_NIMBLE2
    -DOUISPY_BOARD=\"tdongle_c5\"
    -DOUISPY_NO_MESH=1
    -DOUISPY_DONGLE=1
    -DPIN_BUZZER=8
    -DPIN_LED=9
    -DPIN_GPS_RX=12
    -DPIN_GPS_TX=11
    -DDONGLE_SPI_BUS=FSPI
    -DDONGLE_TFT_SCLK=6
    -DDONGLE_TFT_MOSI=2
    -DDONGLE_TFT_MISO=7
    -DDONGLE_TFT_DC=3
    -DDONGLE_TFT_CS=10
    -DDONGLE_TFT_RST=1
    -DDONGLE_TFT_BL=0
    -DDONGLE_TFT_BL_ON=0
    -DDONGLE_TFT_ROTATION=3
    -DDONGLE_LED_DI=5
    -DDONGLE_LED_CI=4
    -DDONGLE_BTN=28
    -DDONGLE_SD_CS=23
    -DDONGLE_SD_HZ=20000000
    ; pioarduino regenerates pioarduino-build.py when custom_sdkconfig is set and
    ; drops the include/fatfs/* CPPPATH entries while still linking -lfatfs, so
    ; the framework SD library cannot find ff.h. Put them back.
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32c5/include/fatfs/src
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32c5/include/fatfs/vfs
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32c5/include/fatfs/diskio

lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
    mikalhart/TinyGPSPlus@^1.1.0
    adafruit/Adafruit GFX Library@^1.11.9

build_src_filter =
    ${env:v3_app_controlled.build_src_filter}
    +<dongle.cpp>
    +<dongle.h>
    +<dongle_st7735.h>

board_build.partitions = partitions_16mb.csv
board_upload.flash_size = 16MB

