; =============================================================================
; OUI-SPY Unified Firmware
; =============================================================================

[env:v3_app_controlled]
platform = espressif32@^6.3.0
board = seeed_xiao_esp32s3
framework = arduino

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCONFIG_BT_NIMBLE_ENABLED=1
    -DCONFIG_BT_NIMBLE_LOG_LEVEL=0
    -DCONFIG_BT_NIMBLE_PINNED_TO_CORE=0
    -DCONFIG_BT_NIMBLE_TASK_STACK_SIZE=8192
    -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192
    -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=50
    -DCONFIG_ESP_COEX_SW_COEXIST_ENABLE=1
    -DOUISPY_BOARD=\"xiao_s3\"

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.0

build_src_filter =
    +<protocol.h>
    +<engine_registry.cpp>
    +<engine_registry.h>
    +<ble_gatt.cpp>
    +<ble_gatt.h>
    +<ota_handler.cpp>
    +<ota_handler.h>
    +<wifi_ota_handler.cpp>
    +<wifi_ota_handler.h>
    +<mesh_espnow.cpp>
    +<mesh_espnow.h>
    +<radio_coex.cpp>
    +<radio_coex.h>
    +<ignore_list.cpp>
    +<ignore_list.h>
    +<main_unified.cpp>
    +<engines/*.cpp>
    +<engines/*.h>
    +<opendroneid.c>
    +<opendroneid.h>
    +<odid_wifi.h>
    +<wifi.c>

board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 8MB

