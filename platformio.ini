; =============================================================================
; TEST-ONLY: real BLE central that drives a node DUT through the phone GATT
; sequence (offline-scan ON + detector) and cycles disconnect/reconnect, to
; reproduce/verify the offline-scan reconnect bug on real hardware. Flash to a
; second S3; read the NODE's serial for engine/scan state. Not shipped.
; =============================================================================
[env:v3_test_central]
extends = env:v3_app_controlled
build_flags =
    ${env:v3_app_controlled.build_flags}
    -DOUISPY_TEST_CENTRAL=1
build_src_filter =
    +<test_central_driver.cpp>

[env:v3_app_controlled_statuslog]
extends = env:v3_app_controlled
build_flags =
    ${env:v3_app_controlled.build_flags}
    -DOUISPY_STATUS_LOG=1

[env:v3_node_manager_s3_dettest]
extends = env:v3_node_manager_s3
build_flags =
    ${env:v3_node_manager_s3.build_flags}
    -DOUISPY_MGR_DET_TEST=1

[env:v3_node_manager_s3_wdcycle]
extends = env:v3_node_manager_s3
build_flags =
    ${env:v3_node_manager_s3.build_flags}
    -DOUISPY_WD_CYCLE_TEST=1

[env:v3_node_manager_s3_engstress]
extends = env:v3_node_manager_s3
build_flags =
    ${env:v3_node_manager_s3.build_flags}
    -DOUISPY_ENGSTRESS=1
    -DOUISPY_NO_RECONCILE=1
